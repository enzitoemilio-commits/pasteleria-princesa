<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<title>QR Pastelería La Princesa</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f5f5f5; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:Georgia,serif; }
  .card {
    background:#fff;
    border-radius:24px;
    padding:40px 48px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    width:420px;
    box-shadow: 0 4px 32px rgba(233,30,143,0.15);
    border: 2px solid #F8C8D8;
  }
  .logo-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .tagline { font-size:13px; color:#999; letter-spacing:1px; font-family:Arial,sans-serif; }
  .qr-wrap {
    border: 5px solid #E91E8F;
    border-radius:16px;
    padding:8px;
    background:#fff;
  }
  .qr-wrap img { display:block; width:260px; height:260px; border-radius:8px; }
  .texto { font-size:15px; color:#555; text-align:center; line-height:1.7; font-family:Arial,sans-serif; }
  .url { font-size:13px; color:#E91E8F; font-weight:bold; letter-spacing:0.5px; font-family:Arial,sans-serif; }
  .footer-line { width:100%; border-top:1px dashed #F8C8D8; padding-top:14px; text-align:center; font-size:11px; color:#bbb; font-family:Arial,sans-serif; }
  @media print {
    body { background:#fff; }
    .card { box-shadow:none; }
  }
</style>
</head>
<body>
<div class="card">

  <!-- Logo -->
  <div class="logo-wrap">
    <svg viewBox="0 0 120 120" width="110" height="110" xmlns="http://www.w3.org/2000/svg">
      <circle cx="60" cy="60" r="57" fill="#E91E8F"/>
      <circle cx="60" cy="60" r="48" fill="#F8C8D8"/>
      <rect x="42" y="72" width="36" height="14" rx="3" fill="white" opacity="0.9"/>
      <path d="M38 71 Q60 65 82 71" stroke="#E91E8F" stroke-width="1.5" fill="none" opacity="0.5"/>
      <rect x="46" y="57" width="28" height="16" rx="3" fill="white" opacity="0.9"/>
      <path d="M43 56 Q60 51 77 56" stroke="#E91E8F" stroke-width="1.5" fill="none" opacity="0.5"/>
      <rect x="50" y="45" width="20" height="13" rx="3" fill="white" opacity="0.9"/>
      <path d="M47 44 Q60 40 73 44" stroke="#E91E8F" stroke-width="1.5" fill="none" opacity="0.5"/>
      <rect x="58" y="38" width="4" height="8" rx="1" fill="white" opacity="0.9"/>
      <ellipse cx="60" cy="37" rx="2.5" ry="3.5" fill="#FAC775" opacity="0.95"/>
      <path id="a1" d="M 20,60 A 40,40 0 0,1 100,60" fill="none"/>
      <text font-size="10.5" font-family="Georgia,serif" font-weight="bold" fill="#111"><textPath href="#a1" startOffset="8%">Pastelería</textPath></text>
      <path id="a2" d="M 18,65 A 42,42 0 0,0 102,65" fill="none"/>
      <text font-size="10.5" font-family="Georgia,serif" font-weight="bold" fill="#111"><textPath href="#a2" startOffset="10%">"La Princesa"</textPath></text>
      <text x="60" y="103" text-anchor="middle" font-size="7.5" font-family="Arial,sans-serif" fill="#C4166F" font-weight="bold">desde 1995</text>
    </svg>
  </div>

  <!-- QR -->
  <div class="qr-wrap">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=https://pastelerialaprincesa.com&margin=12&color=111111&bgcolor=ffffff" alt="QR Pastelería La Princesa"/>
  </div>

  <!-- Texto -->
  <p class="texto">Escanea y ve nuestro catálogo completo,<br>sucursales y haz tu pedido</p>
  <p class="url">pastelerialaprincesa.com</p>

  <div class="footer-line">Santo Domingo Coyoacán · CDMX · Desde 1995</div>

</div>
</body>
</html>
